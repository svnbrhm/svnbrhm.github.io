<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <pattern id="runningPattern" patternUnits="userSpaceOnUse" width="100" height="100">
      <circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/>
      <circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.05)"/>
      <circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1920" height="1080" fill="url(#heroGradient)"/>
  
  <!-- Pattern overlay -->
  <rect width="1920" height="1080" fill="url(#runningPattern)"/>
  
  <!-- Running track elements -->
  <path d="M0 400 Q480 350 960 400 T1920 400" stroke="rgba(255,255,255,0.1)" stroke-width="3" fill="none"/>
  <path d="M0 500 Q480 450 960 500 T1920 500" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>
  <path d="M0 600 Q480 550 960 600 T1920 600" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>
  
  <!-- Abstract running figures -->
  <g opacity="0.1">
    <circle cx="300" cy="400" r="8" fill="white"/>
    <ellipse cx="295" cy="415" rx="12" ry="6" fill="white"/>
    <ellipse cx="305" cy="415" rx="12" ry="6" fill="white"/>
  </g>
  
  <g opacity="0.08">
    <circle cx="800" cy="500" r="6" fill="white"/>
    <ellipse cx="796" cy="512" rx="10" ry="5" fill="white"/>
    <ellipse cx="804" cy="512" rx="10" ry="5" fill="white"/>
  </g>
  
  <g opacity="0.06">
    <circle cx="1400" cy="600" r="5" fill="white"/>
    <ellipse cx="1397" cy="610" rx="8" ry="4" fill="white"/>
    <ellipse cx="1403" cy="610" rx="8" ry="4" fill="white"/>
  </g>
</svg>